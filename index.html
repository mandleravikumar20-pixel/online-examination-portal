<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Examination Portal</title>


    <style>

        /* =====================================================
           GLOBAL
           ===================================================== */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #f2f5f9;

            color: #222;

        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            background-color: #1f4e78;

            color: white;

            text-align: center;

            padding: 22px;

        }


        .header h1 {

            margin: 0;

            font-size: 30px;

        }


        /* =====================================================
           CARD
           ===================================================== */

        .card {

            width: 90%;

            max-width: 900px;

            margin: 40px auto;

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.12);

        }


        .hidden {

            display: none;

        }


        h2 {

            text-align: center;

            margin-top: 0;

            color: #1f4e78;

        }


        /* =====================================================
           PAGE 1
           ===================================================== */

        #userPage > p {

            text-align: center;

            font-size: 17px;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

        }


        input[type="text"],
        input[type="email"] {

            width: 100%;

            padding: 12px;

            border: 1px solid #aaa;

            border-radius: 5px;

            font-size: 16px;

        }


        input[readonly] {

            background-color: #eeeeee;

        }


        /* =====================================================
           ERRORS
           ===================================================== */

        .error {

            color: red;

            font-weight: bold;

            margin-top: 7px;

            min-height: 20px;

        }


        /* =====================================================
           BUTTON
           ===================================================== */

        button {

            background-color: #1f4e78;

            color: white;

            border: none;

            padding: 13px 28px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 16px;

        }


        button:hover {

            background-color: #163a5c;

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        .button-container {

            text-align: center;

            margin-top: 25px;

        }


        /* =====================================================
           PAGE 2 - PREFERENCE
           ===================================================== */

        .preference-title {

            margin-bottom: 30px;

        }


        .preference-container {

            display: flex;

            justify-content: center;

            align-items: stretch;

            gap: 25px;

            flex-wrap: wrap;

            margin-top: 20px;

        }


        .preference-option {

            border: 3px solid #ccc;

            border-radius: 12px;

            padding: 12px;

            width: 240px;

            background-color: white;

            text-align: center;

            cursor: pointer;

            transition: 0.25s;

            overflow: hidden;

        }


        .preference-option:hover {

            border-color: #1f4e78;

            background-color: #f4f8fc;

            transform: translateY(-4px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

        }


        .preference-option.selected {

            border-color: #1f4e78;

            background-color: #e8f1fa;

            box-shadow:
                0 5px 18px rgba(31, 78, 120, 0.25);

        }


        .preference-image {

            width: 100%;

            height: 150px;

            object-fit: cover;

            border-radius: 8px;

            display: block;

            margin-bottom: 15px;

        }


        .preference-name {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            font-size: 18px;

            padding: 8px;

        }


        .preference-name input {

            width: 18px;

            height: 18px;

            cursor: pointer;

        }


        .preference-name strong {

            cursor: pointer;

        }


        /* =====================================================
           PAGE 3 - QUESTIONS
           ===================================================== */

        .question-block {

            margin-bottom: 30px;

            padding: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            transition: 0.2s;

        }


        .question-text {

            font-weight: bold;

            margin-bottom: 15px;

            font-size: 17px;

        }


        .answer-option {

            margin: 10px 0;

            padding: 8px;

        }


        .answer-option label {

            display: inline;

            font-weight: normal;

            cursor: pointer;

        }


        .answer-option input {

            margin-right: 8px;

        }


        /* =====================================================
           UNANSWERED QUESTION
           ===================================================== */

        .question-block.unanswered {

            border: 2px solid red;

            background-color: #fff5f5;

        }


        .question-error {

            color: red;

            font-weight: bold;

            margin-top: 12px;

            font-size: 15px;

        }


        /* =====================================================
           PAGE 4 - RESULT
           ===================================================== */

        .result-summary {

            background-color: #f4f7fa;

            padding: 20px;

            border-radius: 8px;

            margin-bottom: 25px;

        }


        .result-summary p {

            margin: 8px 0;

        }


        .result-question {

            border: 1px solid #ccc;

            padding: 18px;

            margin-bottom: 15px;

            border-radius: 7px;

        }


        .correct {

            color: green;

            font-weight: bold;

        }


        .incorrect {

            color: red;

            font-weight: bold;

        }


        .score {

            text-align: center;

            font-size: 26px;

            font-weight: bold;

            color: #1f4e78;

            margin: 20px 0;

        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading {

            text-align: center;

            font-weight: bold;

            padding: 30px;

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .card {

                width: 95%;

                padding: 20px;

            }


            .preference-option {

                width: 100%;

                max-width: 320px;

            }


            .preference-image {

                height: 180px;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================================
     HEADER
     ========================================================== -->

<div class="header">

    <h1>
        Online Examination Portal
    </h1>

</div>



<!-- ==========================================================
     PAGE 1 - CANDIDATE DETAILS
     ========================================================== -->

<div id="userPage"
     class="card">


    <p>
        Please enter your name and e-mail address to begin the examination.
    </p>


    <h2>
        Candidate Details
    </h2>


    <div class="form-group">

        <label for="fname">
            Name
        </label>


        <input
            type="text"
            id="fname"
            placeholder="Enter your name"
        >


        <div
            id="fnameError"
            class="error">
        </div>

    </div>



    <div class="form-group">

        <label for="email">
            E-mail
        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your e-mail address"
        >


        <div
            id="emailError"
            class="error">
        </div>

    </div>



    <div class="form-group">

        <label for="attemptId">
            Attempt ID
        </label>


        <input
            type="text"
            id="attemptId"
            readonly
        >

    </div>



    <div class="button-container">

        <button
            type="button"
            onclick="validateUserAndContinue()">

            Continue

        </button>

    </div>


</div>



<!-- ==========================================================
     PAGE 2 - PREFERENCE
     ========================================================== -->

<div id="preferencePage"
     class="card hidden">


    <h2 class="preference-title">
        Select Your Preference
    </h2>


    <div class="preference-container">


        <!-- SPORTS -->

        <div
            class="preference-option"
            onclick="selectPreference('Sports', this)"
        >

            <img
                src="https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=600&q=80"
                alt="Sports"
                class="preference-image"
            >


            <div class="preference-name">

                <input
                    type="radio"
                    name="preference"
                    value="Sports"
                >

                <strong>
                    Sports
                </strong>

            </div>

        </div>



        <!-- MOVIES -->

        <div
            class="preference-option"
            onclick="selectPreference('Movies', this)"
        >

            <img
                src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80"
                alt="Movies"
                class="preference-image"
            >


            <div class="preference-name">

                <input
                    type="radio"
                    name="preference"
                    value="Movies"
                >

                <strong>
                    Movies
                </strong>

            </div>

        </div>



        <!-- CRICKET -->

        <div
            class="preference-option"
            onclick="selectPreference('Cricket', this)"
        >

            <img
                src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=600&q=80"
                alt="Cricket"
                class="preference-image"
            >


            <div class="preference-name">

                <input
                    type="radio"
                    name="preference"
                    value="Cricket"
                >

                <strong>
                    Cricket
                </strong>

            </div>

        </div>


    </div>



    <div
        id="preferenceError"
        class="error"
        style="text-align:center;">
    </div>



    <div class="button-container">

        <button
            type="button"
            onclick="startExamination()">

            Start Examination

        </button>

    </div>


</div>



<!-- ==========================================================
     PAGE 3 - QUESTIONS
     ========================================================== -->

<div id="questionPage"
     class="card hidden">


    <h2>
        Examination
    </h2>


    <div id="questionsContainer">

        <div class="loading">
            Loading questions...
        </div>

    </div>



    <div
        id="questionError"
        class="error"
        style="text-align:center;">
    </div>



    <div class="button-container">

        <button
            type="button"
            onclick="submitExam()">

            Submit Examination

        </button>

    </div>


</div>



<!-- ==========================================================
     PAGE 4 - RESULT
     ========================================================== -->

<div id="resultPage"
     class="card hidden">


    <h2>
        Examination Result
    </h2>


    <div
        id="resultSummary"
        class="result-summary">
    </div>


    <div
        id="scoreDisplay"
        class="score">
    </div>


    <div
        id="resultQuestions">
    </div>


</div>



<script>


/* ============================================================
   GOOGLE APPS SCRIPT URL
   ============================================================ */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwnXv2xs3t_qYlo70opN7PSyUt_TzHIYx7YXUfhTOZFomIXEsBjkGUSddbdDa_uE-aj/exec";



/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let selectedPreference = "";

let currentQuestions = [];

let userName = "";

let userEmail = "";

let attemptId = "";



/* ============================================================
   GENERATE ATTEMPT ID
   ============================================================ */

function generateAttemptID() {

    const now = new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const hour =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minute =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const second =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const randomPart =
        Math.random()
            .toString(36)
            .substring(
                2,
                8
            )
            .toUpperCase();


    return (

        "ATT-" +

        year +

        month +

        day +

        "-" +

        hour +

        minute +

        second +

        "-" +

        randomPart

    );

}



/* ============================================================
   CREATE ATTEMPT ID ON LOGIN PAGE
   ============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        attemptId =
            generateAttemptID();


        document.getElementById(
            "attemptId"
        ).value =
            attemptId;

    }
);



/* ============================================================
   VALIDATE USER
   ============================================================ */

async function validateUserAndContinue() {


    clearErrors();


    const name =
        document.getElementById(
            "fname"
        )
        .value
        .trim();


    const email =
        document.getElementById(
            "email"
        )
        .value
        .trim()
        .toLowerCase();


    let valid =
        true;



    /* ========================================================
       NAME VALIDATION
       ======================================================== */

    if (!name) {

        document.getElementById(
            "fnameError"
        ).textContent =
            "Please enter your name.";

        valid =
            false;

    }

    else if (
        !/^[A-Za-z ]+$/.test(name)
    ) {

        document.getElementById(
            "fnameError"
        ).textContent =
            "Name should contain letters and spaces only.";

        valid =
            false;

    }

    else if (
        name.replace(
            /\s/g,
            ""
        ).length < 6
    ) {

        document.getElementById(
            "fnameError"
        ).textContent =
            "Name must contain at least 6 letters.";

        valid =
            false;

    }



    /* ========================================================
       EMAIL VALIDATION
       ======================================================== */

    if (!email) {

        document.getElementById(
            "emailError"
        ).textContent =
            "Please enter your e-mail address.";

        valid =
            false;

    }

    else if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    ) {

        document.getElementById(
            "emailError"
        ).textContent =
            "Please enter a valid e-mail address.";

        valid =
            false;

    }



    if (!valid) {

        return;

    }



    const button =
        document.querySelector(
            "#userPage button"
        );


    button.disabled =
        true;


    button.textContent =
        "Checking...";



    try {


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },


                    body:
                        JSON.stringify({

                            action:
                                "validateUser",

                            email:
                                email,

                            attemptId:
                                attemptId

                        })

                }
            );



        const result =
            await response.json();



        if (!result.success) {


            document.getElementById(
                "emailError"
            ).textContent =
                result.error ||
                "You are not authorized to take the examination.";


            return;

        }



        userName =
            name;


        userEmail =
            email;



        document.getElementById(
            "userPage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "preferencePage"
        ).classList.remove(
            "hidden"
        );


    }

    catch (error) {


        console.error(error);


        document.getElementById(
            "emailError"
        ).textContent =
            "Unable to connect to the examination server. Please try again.";

    }

    finally {


        button.disabled =
            false;


        button.textContent =
            "Continue";

    }

}



/* ============================================================
   SELECT PREFERENCE
   ============================================================ */

function selectPreference(
    preference,
    element
) {


    selectedPreference =
        preference;



    document
        .querySelectorAll(
            ".preference-option"
        )
        .forEach(
            function(option) {

                option.classList.remove(
                    "selected"
                );

            }
        );



    element.classList.add(
        "selected"
    );



    const radio =
        element.querySelector(
            "input"
        );


    radio.checked =
        true;



    document.getElementById(
        "preferenceError"
    ).textContent =
        "";

}



/* ============================================================
   START EXAMINATION
   ============================================================ */

function startExamination() {


    document.getElementById(
        "preferenceError"
    ).textContent =
        "";


    if (
        !selectedPreference
    ) {

        document.getElementById(
            "preferenceError"
        ).textContent =
            "Please select your preference.";

        return;

    }



    document.getElementById(
        "preferencePage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "questionPage"
    ).classList.remove(
        "hidden"
    );


    loadQuestions();

}



/* ============================================================
   LOAD QUESTIONS
   ============================================================ */

async function loadQuestions() {


    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML =
        '<div class="loading">Loading questions...</div>';



    try {


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL +
                "?action=getQuestions"
            );



        const result =
            await response.json();



        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to load questions."
            );

        }



        const allQuestions =
            result.questions || [];



        const categoryQuestions =
            allQuestions.filter(
                function(question) {

                    return String(
                        question.Category || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    selectedPreference
                        .trim()
                        .toLowerCase();

                }
            );



        if (
            categoryQuestions.length < 5
        ) {

            throw new Error(

                "There are fewer than 5 questions available for " +
                selectedPreference +
                "."

            );

        }



        shuffleArray(
            categoryQuestions
        );



        currentQuestions =
            categoryQuestions.slice(
                0,
                5
            );



        renderQuestions();


    }

    catch (error) {


        console.error(error);


        container.innerHTML =
            "";


        document.getElementById(
            "questionError"
        ).textContent =
            "Unable to load the questions. " +
            error.message;

    }

}



/* ============================================================
   SHUFFLE QUESTIONS
   ============================================================ */

function shuffleArray(array) {


    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {


        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}



/* ============================================================
   RENDER QUESTIONS
   ============================================================ */

function renderQuestions() {


    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML =
        "";



    currentQuestions.forEach(
        function(
            question,
            index
        ) {


            const questionNumber =
                index + 1;



            const block =
                document.createElement(
                    "div"
                );


            block.className =
                "question-block";



            /* Store question number */

            block.dataset.questionNumber =
                questionNumber;



            const questionText =
                document.createElement(
                    "div"
                );


            questionText.className =
                "question-text";


            questionText.textContent =
                questionNumber +
                ". " +
                question.Question;



            block.appendChild(
                questionText
            );



            const options = [

                question["Option 1"],

                question["Option 2"],

                question["Option 3"],

                question["Option 4"]

            ];



            options.forEach(
                function(
                    option,
                    optionIndex
                ) {


                    if (
                        String(
                            option || ""
                        ).trim() === ""
                    ) {

                        return;

                    }



                    const optionDiv =
                        document.createElement(
                            "div"
                        );


                    optionDiv.className =
                        "answer-option";



                    const radio =
                        document.createElement(
                            "input"
                        );


                    radio.type =
                        "radio";


                    radio.name =
                        "question" +
                        questionNumber;


                    radio.value =
                        option;


                    radio.id =
                        "q" +
                        questionNumber +
                        "_" +
                        optionIndex;



                    /* ----------------------------------------
                       REMOVE RED HIGHLIGHT IMMEDIATELY WHEN
                       USER SELECTS AN ANSWER
                       ---------------------------------------- */

                    radio.addEventListener(
                        "change",
                        function() {

                            block.classList.remove(
                                "unanswered"
                            );


                            const errorMessage =
                                block.querySelector(
                                    ".question-error"
                                );


                            if (errorMessage) {

                                errorMessage.remove();

                            }

                        }
                    );



                    const label =
                        document.createElement(
                            "label"
                        );


                    label.htmlFor =
                        radio.id;


                    label.textContent =
                        option;



                    optionDiv.appendChild(
                        radio
                    );


                    optionDiv.appendChild(
                        label
                    );


                    block.appendChild(
                        optionDiv
                    );

                }
            );



            container.appendChild(
                block
            );

        }
    );

}



/* ============================================================
   SUBMIT EXAM
   ============================================================ */

async function submitExam() {


    /* ========================================================
       CLEAR GENERAL QUESTION ERROR
       ======================================================== */

    document.getElementById(
        "questionError"
    ).textContent =
        "";



    /* ========================================================
       CHECK EVERY QUESTION INDIVIDUALLY
       ======================================================== */

    let hasUnansweredQuestions =
        false;


    const questionBlocks =
        document.querySelectorAll(
            ".question-block"
        );



    currentQuestions.forEach(
        function(
            question,
            index
        ) {


            const questionNumber =
                index + 1;


            const questionBlock =
                questionBlocks[index];



            const selected =
                document.querySelector(
                    'input[name="question' +
                    questionNumber +
                    '"]:checked'
                );



            /* ------------------------------------------------
               REMOVE OLD ERROR FIRST
               ------------------------------------------------ */

            questionBlock.classList.remove(
                "unanswered"
            );


            const oldError =
                questionBlock.querySelector(
                    ".question-error"
                );


            if (oldError) {

                oldError.remove();

            }



            /* ------------------------------------------------
               IF UNANSWERED
               ------------------------------------------------ */

            if (!selected) {


                hasUnansweredQuestions =
                    true;


                /* RED HIGHLIGHT */

                questionBlock.classList.add(
                    "unanswered"
                );


                /* CREATE ERROR MESSAGE */

                const errorMessage =
                    document.createElement(
                        "div"
                    );


                errorMessage.className =
                    "question-error";


                errorMessage.textContent =
                    "Please answer this Question.";


                questionBlock.appendChild(
                    errorMessage
                );

            }

        }
    );



    /* ========================================================
       STOP SUBMISSION
       ======================================================== */

    if (
        hasUnansweredQuestions
    ) {


        /* Scroll to first unanswered question */

        const firstUnanswered =
            document.querySelector(
                ".question-block.unanswered"
            );


        if (firstUnanswered) {

            firstUnanswered.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "center"

            });

        }


        return;

    }



    /* ========================================================
       SUBMIT BUTTON
       ======================================================== */

    const submitButton =
        document.querySelector(
            "#questionPage button"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "Submitting...";



    /* ========================================================
       CALCULATE SCORE
       ======================================================== */

    let score =
        0;


    const answers =
        [];



    currentQuestions.forEach(
        function(
            question,
            index
        ) {


            const questionNumber =
                index + 1;



            const selected =
                document.querySelector(
                    'input[name="question' +
                    questionNumber +
                    '"]:checked'
                );



            const userAnswer =
                selected
                    ? selected.value
                    : "";



            const correctAnswer =
                String(
                    question.CorrectAnswer ||
                    ""
                ).trim();



            if (
                userAnswer
                    .trim()
                    .toLowerCase()
                ===
                correctAnswer
                    .trim()
                    .toLowerCase()
            ) {

                score++;

            }



            answers.push({

                question:
                    question.Question,

                answer:
                    userAnswer,

                correctAnswer:
                    correctAnswer

            });

        }
    );



    /* ========================================================
       SAVE RESPONSE
       ======================================================== */

    try {


        const response =
            await fetch(
                GOOGLE_SCRIPT_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },


                    body:
                        JSON.stringify({

                            action:
                                "saveResponse",

                            attemptId:
                                attemptId,

                            name:
                                userName,

                            email:
                                userEmail,

                            preference:
                                selectedPreference,

                            answers:
                                answers,

                            score:
                                score

                        })

                }
            );



        const result =
            await response.json();



        if (
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save the examination."
            );

        }



        showResult(
            score,
            answers
        );


    }

    catch (error) {


        console.error(error);


        document.getElementById(
            "questionError"
        ).textContent =
            "Unable to submit the examination. " +
            error.message;



        submitButton.disabled =
            false;


        submitButton.textContent =
            "Submit Examination";

    }

}



/* ============================================================
   SHOW RESULT
   ============================================================ */

function showResult(
    score,
    answers
) {


    document.getElementById(
        "questionPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "resultPage"
    ).classList.remove(
        "hidden"
    );



    document.getElementById(
        "resultSummary"
    ).innerHTML =

        "<p><strong>Name:</strong> " +
        escapeHtml(userName) +
        "</p>" +

        "<p><strong>Email:</strong> " +
        escapeHtml(userEmail) +
        "</p>" +

        "<p><strong>Attempt ID:</strong> " +
        escapeHtml(attemptId) +
        "</p>" +

        "<p><strong>Preference:</strong> " +
        escapeHtml(selectedPreference) +
        "</p>";



    document.getElementById(
        "scoreDisplay"
    ).textContent =

        "Score: " +
        score +
        " / " +
        answers.length;



    const resultContainer =
        document.getElementById(
            "resultQuestions"
        );


    resultContainer.innerHTML =
        "";



    answers.forEach(
        function(
            item,
            index
        ) {


            const isCorrect =

                item.answer
                    .trim()
                    .toLowerCase()
                ===
                item.correctAnswer
                    .trim()
                    .toLowerCase();



            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-question";



            div.innerHTML =

                "<p><strong>Question " +
                (index + 1) +
                ":</strong> " +
                escapeHtml(
                    item.question
                ) +
                "</p>" +

                "<p><strong>Your Answer:</strong> " +
                escapeHtml(
                    item.answer
                ) +
                "</p>" +

                "<p><strong>Correct Answer:</strong> " +
                escapeHtml(
                    item.correctAnswer
                ) +
                "</p>" +

                "<p class='" +
                (
                    isCorrect
                        ? "correct"
                        : "incorrect"
                ) +
                "'>" +

                (
                    isCorrect
                        ? "Correct"
                        : "Incorrect"
                ) +

                "</p>";



            resultContainer.appendChild(
                div
            );

        }
    );

}



/* ============================================================
   CLEAR ERRORS
   ============================================================ */

function clearErrors() {


    document.getElementById(
        "fnameError"
    ).textContent =
        "";


    document.getElementById(
        "emailError"
    ).textContent =
        "";


    document.getElementById(
        "preferenceError"
    ).textContent =
        "";


    document.getElementById(
        "questionError"
    ).textContent =
        "";

}



/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {


    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
